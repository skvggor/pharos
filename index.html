    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="canonical" href="https://skvggor.github.io/pharos/" />

    <title>Pharos — a serif pixel display font for React</title>

      name="description"
      content="A serif pixel display font for React. Render text as a configurable grid of pixels — squares, dots, diamonds or rings — with kerning, fluid sizing and per-pixel animation."
